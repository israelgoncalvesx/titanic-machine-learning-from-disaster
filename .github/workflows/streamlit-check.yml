name: Streamlit deployment check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall app src

      - name: Test saved model prediction
        run: python -m src.predict

      - name: Check dashboard data source
        run: |
          python - <<'PY'
          import pandas as pd

          url = (
              "https://raw.githubusercontent.com/"
              "Bhasfe/titanic/master/train.csv"
          )

          required_columns = {
              "PassengerId",
              "Survived",
              "Pclass",
              "Sex",
              "Age",
              "SibSp",
              "Parch",
              "Fare",
              "Embarked",
          }

          data = pd.read_csv(url)
          missing = required_columns - set(data.columns)

          if missing:
              raise RuntimeError(
                  f"Missing dashboard columns: {sorted(missing)}"
              )

          print(f"Dashboard rows: {len(data)}")
          PY

      - name: Start Streamlit and check health
        run: |
          python -m streamlit run app/streamlit_app.py \
            --server.headless true \
            --server.port 8501 \
            > streamlit.log 2>&1 &

          for attempt in {1..12}; do
            if curl --fail http://localhost:8501/_stcore/health; then
              exit 0
            fi

            sleep 5
          done

          cat streamlit.log
          exit 1
